<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc" width="1600" height="720">
  <title id="title">QEC assignment data architecture</title>
  <desc id="desc">Three quantum error correction sources flow through Bronze, Silver, Gold and ML data stages into three machine learning models. Results hold quality issues, run records and source tracing.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17212b" flood-opacity="0.10" />
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#78909c" />
    </marker>
    <style>
      .stage { filter: url(#shadow); stroke-width: 2; }
      .stage-label { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 2px; }
      .stage-title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #16232d; }
      .small { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5e6f78; }
      .pill { font: 600 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #30444e; }
      .source { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #22343e; }
      .source-sub { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6b7c85; }
      .flow { fill: none; stroke: #78909c; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow); }
      .support-line { fill: none; stroke: #a8b6bd; stroke-width: 2.5; stroke-dasharray: 7 8; }
    </style>
  </defs>
  <rect width="1600" height="720" rx="28" fill="#f7fafb" />
  <!-- Source cards -->
  <text x="78" y="62" class="stage-label" fill="#607d8b">QEC SOURCES</text>
  <g filter="url(#shadow)">
    <rect x="70" y="92" width="270" height="112" rx="20" fill="#ffffff" stroke="#d9e3e7" stroke-width="2" />
    <circle cx="111" cy="134" r="18" fill="#7c4dff" opacity="0.16" />
    <path d="M101 134h20M111 124v20" stroke="#6c43da" stroke-width="3" stroke-linecap="round" />
    <text x="145" y="132" class="source">Syndrome CSV</text>
    <text x="145" y="160" class="source-sub">weighted simulations</text>
    <rect x="70" y="242" width="270" height="112" rx="20" fill="#ffffff" stroke="#d9e3e7" stroke-width="2" />
    <circle cx="111" cy="284" r="18" fill="#00a6a6" opacity="0.16" />
    <path d="M100 290l7-12 8 8 8-15" fill="none" stroke="#008f91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="145" y="282" class="source">Google QEC</text>
    <text x="145" y="310" class="source-sub">hardware shots</text>
    <rect x="70" y="392" width="270" height="112" rx="20" fill="#ffffff" stroke="#d9e3e7" stroke-width="2" />
    <circle cx="111" cy="434" r="18" fill="#ff8f00" opacity="0.17" />
    <path d="M99 434h24M105 426v16M117 426v16" fill="none" stroke="#df7c00" stroke-width="3" stroke-linecap="round" />
    <text x="145" y="432" class="source">QASMBench</text>
    <text x="145" y="460" class="source-sub">QEC circuits</text>
  </g>
  <!-- Flow lines are behind the stage cards -->
  <path d="M340 148 H366 Q384 148 384 166 V286" class="support-line" />
  <path d="M340 298 H384" class="support-line" />
  <path d="M340 448 H366 Q384 448 384 430 V310" class="support-line" />
  <path d="M574 298 H618" class="flow" />
  <path d="M804 298 H848" class="flow" />
  <path d="M1068 298 H1112" class="flow" />
  <path d="M1308 298 H1352" class="flow" />
  <!-- Bronze -->
  <g>
    <rect class="stage" x="384" y="124" width="190" height="348" rx="24" fill="#f2e5d8" stroke="#c18b5a" />
    <text x="479" y="170" text-anchor="middle" class="stage-label" fill="#8a5a2f">BRONZE</text>
    <rect x="420" y="205" width="118" height="82" rx="14" fill="#ffffff" opacity="0.84" />
    <path d="M445 222h48l18 18v31h-66z" fill="none" stroke="#a66d3b" stroke-width="3" stroke-linejoin="round" />
    <path d="M493 222v18h18" fill="none" stroke="#a66d3b" stroke-width="3" stroke-linejoin="round" />
    <text x="479" y="333" text-anchor="middle" class="stage-title">Original ZIPs</text>
    <text x="479" y="365" text-anchor="middle" class="small">read-only</text>
    <rect x="420" y="399" width="118" height="36" rx="18" fill="#ffffff" opacity="0.76" />
    <text x="479" y="422" text-anchor="middle" class="pill">checksums</text>
  </g>
  <!-- Silver -->
  <g>
    <rect class="stage" x="618" y="124" width="186" height="348" rx="24" fill="#edf3f5" stroke="#8ca4af" />
    <text x="711" y="170" text-anchor="middle" class="stage-label" fill="#607d8b">SILVER</text>
    <path d="M671 216h80v70h-80z M671 239h80 M698 216v70 M725 216v70" fill="none" stroke="#78909c" stroke-width="3" />
    <text x="711" y="333" text-anchor="middle" class="stage-title">Clean Parquet</text>
    <rect x="653" y="364" width="116" height="30" rx="15" fill="#ffffff" />
    <text x="711" y="385" text-anchor="middle" class="pill">syndromes</text>
    <rect x="653" y="402" width="116" height="30" rx="15" fill="#ffffff" />
    <text x="711" y="423" text-anchor="middle" class="pill">shots · circuits</text>
  </g>
  <!-- Gold -->
  <g>
    <rect class="stage" x="848" y="104" width="220" height="388" rx="24" fill="#fff4cf" stroke="#d6a800" />
    <text x="958" y="152" text-anchor="middle" class="stage-label" fill="#997800">GOLD</text>
    <ellipse cx="958" cy="218" rx="54" ry="18" fill="#ffffff" stroke="#b99100" stroke-width="3" />
    <path d="M904 218v64c0 10 24 18 54 18s54-8 54-18v-64 M904 250c0 10 24 18 54 18s54-8 54-18" fill="#ffffff" stroke="#b99100" stroke-width="3" />
    <text x="958" y="340" text-anchor="middle" class="stage-title">PostgreSQL</text>
    <rect x="889" y="370" width="138" height="30" rx="15" fill="#ffffff" />
    <text x="958" y="391" text-anchor="middle" class="pill">QEC relations</text>
    <rect x="889" y="408" width="138" height="30" rx="15" fill="#ffffff" />
    <text x="958" y="429" text-anchor="middle" class="pill">keys · joins · SQL</text>
  </g>
  <!-- ML export -->
  <g>
    <rect class="stage" x="1112" y="124" width="196" height="348" rx="24" fill="#e7f5ef" stroke="#55a982" />
    <text x="1210" y="170" text-anchor="middle" class="stage-label" fill="#34815f">ML DATA</text>
    <path d="M1163 216h94v70h-94z M1163 239h94 M1194 216v70 M1225 216v70" fill="none" stroke="#42946e" stroke-width="3" />
    <text x="1210" y="333" text-anchor="middle" class="stage-title">Parquet</text>
    <rect x="1142" y="364" width="136" height="30" rx="15" fill="#ffffff" />
    <text x="1210" y="385" text-anchor="middle" class="pill">syndrome examples</text>
    <rect x="1142" y="402" width="136" height="30" rx="15" fill="#ffffff" />
    <text x="1210" y="423" text-anchor="middle" class="pill">Google examples</text>
  </g>
  <!-- Part II models -->
  <g>
    <rect class="stage" x="1352" y="124" width="178" height="348" rx="24" fill="#ece8ff" stroke="#8068cc" />
    <text x="1441" y="170" text-anchor="middle" class="stage-label" fill="#6350ad">PART II</text>
    <circle cx="1441" cy="240" r="44" fill="#ffffff" />
    <circle cx="1421" cy="229" r="7" fill="#8068cc" />
    <circle cx="1461" cy="229" r="7" fill="#8068cc" />
    <circle cx="1441" cy="257" r="7" fill="#8068cc" />
    <path d="M1427 233l10 18M1455 233l-10 18M1428 229h26" stroke="#8068cc" stroke-width="3" />
    <text x="1441" y="326" text-anchor="middle" class="stage-title">AI models</text>
    <rect x="1383" y="356" width="116" height="30" rx="15" fill="#ffffff" />
    <text x="1441" y="377" text-anchor="middle" class="pill">syndrome</text>
    <rect x="1383" y="394" width="116" height="30" rx="15" fill="#ffffff" />
    <text x="1441" y="415" text-anchor="middle" class="pill">combined · raw</text>
  </g>
  <!-- Results lane -->
  <path d="M479 472V594 M711 472V594 M958 492V594 M1210 472V594" class="support-line" />
  <rect x="384" y="594" width="924" height="82" rx="22" fill="#ffffff" stroke="#c9d5da" stroke-width="2" stroke-dasharray="7 7" />
  <text x="426" y="627" class="stage-label" fill="#78909c">RESULTS</text>
  <rect x="735" y="613" width="142" height="40" rx="20" fill="#eef3f5" />
  <text x="806" y="639" text-anchor="middle" class="pill">quality issues</text>
  <rect x="895" y="613" width="126" height="40" rx="20" fill="#eef3f5" />
  <text x="958" y="639" text-anchor="middle" class="pill">run records</text>
  <rect x="1039" y="613" width="150" height="40" rx="20" fill="#eef3f5" />
  <text x="1114" y="639" text-anchor="middle" class="pill">source tracing</text>
</svg>